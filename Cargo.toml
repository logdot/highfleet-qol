[package]
name = "highfleet-qol"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
1_151 = []
1_163 = []

[dependencies]
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git", rev = "5547834da9543827f3023619ae6c4cb2474bf949" }
log = "0.4.28"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
highfleet = { path = "highfleet-rs" }
libc = "0.2.177"
patchy = { package = "highfleet-patchy-client", git = "https://github.com/logdot/Highfleet-Modloader.git", rev = "5547834da9543827f3023619ae6c4cb2474bf949" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
